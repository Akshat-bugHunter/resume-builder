<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Resume logo</title>
  <desc id="desc">White and blue resume document icon with the word Resume and the tagline Manage Track Grow on a black background.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18B7FF"/>
      <stop offset="1" stop-color="#087BFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#000000"/>

  <!-- Resume document icon -->
  <g transform="translate(70 72)">
    <path d="M35 0h205l78 78v206c0 19-15 34-34 34H35c-19 0-35-15-35-34V35C0 16 16 0 35 0Z" fill="#050505" stroke="#fff" stroke-width="12"/>
    <path d="M240 0v78h78" fill="url(#blue)"/>
    <circle cx="78" cy="92" r="30" fill="url(#blue)"/>
    <rect x="125" y="76" width="92" height="13" rx="6.5" fill="#fff"/>
    <rect x="125" y="103" width="70" height="13" rx="6.5" fill="#fff" opacity=".9"/>
    <circle cx="56" cy="160" r="8" fill="url(#blue)"/>
    <rect x="78" y="153" width="145" height="14" rx="7" fill="#fff"/>
    <circle cx="56" cy="198" r="8" fill="url(#blue)"/>
    <rect x="78" y="191" width="125" height="14" rx="7" fill="#fff"/>
    <circle cx="56" cy="236" r="8" fill="url(#blue)"/>
    <rect x="78" y="229" width="105" height="14" rx="7" fill="#fff"/>

    <!-- Pen -->
    <g transform="translate(195 125) rotate(28)">
      <rect x="0" y="0" width="30" height="132" rx="10" fill="#fff"/>
      <rect x="6" y="16" width="18" height="82" rx="7" fill="url(#blue)"/>
      <path d="M0 132l15 30 15-30Z" fill="#fff"/>
      <path d="M9 150l6 12 6-12Z" fill="#18B7FF"/>
    </g>

    <!-- Orbit swoosh -->
    <path d="M-30 220C35 310 176 325 255 245" fill="none" stroke="url(#blue)" stroke-width="15" stroke-linecap="round"/>
    <path d="M-20 250C65 335 205 324 285 244" fill="none" stroke="#18B7FF" stroke-width="8" stroke-linecap="round" opacity=".95"/>
  </g>

  <!-- Wordmark -->
  <text x="425" y="235" font-family="Inter, Arial, Helvetica, sans-serif" font-size="154" font-weight="800" letter-spacing="-7" fill="#fff">Resu<tspan fill="url(#blue)">m</tspan><tspan fill="#fff">e</tspan></text>

  <!-- Tagline -->
  <text x="430" y="300" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="500" letter-spacing="12" fill="#fff">MANAGE</text>
  <circle cx="635" cy="288" r="8" fill="#18B7FF"/>
  <text x="685" y="300" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="500" letter-spacing="12" fill="#fff">TRACK</text>
  <circle cx="855" cy="288" r="8" fill="#18B7FF"/>
  <text x="905" y="300" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="500" letter-spacing="12" fill="#fff">GROW</text>
</svg>
